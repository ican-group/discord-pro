# /etc/systemd/system/docker.service.d/10-after-wg-bbp.conf (spec 008 Stage 10)
# The API is published on the WireGuard address 10.50.0.20, which exists only while
# wg-bbp is up. Start Docker after the tunnel so the port binding succeeds on boot.
# (If the tunnel cannot come up, the API container fails closed: it does not start,
# and it is never published on any other address.)
[Unit]
Wants=wg-quick@wg-bbp.service
After=wg-quick@wg-bbp.service
