# PROPOSED (Spec 012 Phase 6D) — NOT STARTED. Private beta stack beside production on BBP1.
#
#   docker compose -p bitbotpro-beta -f deploy/proposed/beta/docker-compose.beta.yml \
#       --env-file deploy/proposed/beta/beta.env up -d
#   docker compose -p bitbotpro-beta -f deploy/proposed/beta/docker-compose.beta.yml stop     # independent stop
#
# Isolation from production (bitbotpro-api / bitbotpro-mongo / bitbotpro-postgres, project "bitbotpro-api"):
# - own compose project, own container names (bitbotpro-beta-*), own egress network;
# - joins the existing internal network bitbotpro_db ONLY to reach MongoDB, with a MongoDB user
#   that can use bitbotpro_v12 and nothing else (rehearsed: deploy/rehearsal/beta-db-isolation-rehearsal.sh);
#   it holds no PostgreSQL credential;
# - publishes only on the WireGuard address, on ports production does not use (8001 API, 8002 web);
# - own secret files ($BITBOTPRO_BETA_SECRETS_DIR), own logs (json-file per container), hard CPU,
#   memory and PID limits. Never `down -v`: there are no named volumes in this project.

name: bitbotpro-beta

networks:
  db:
    name: bitbotpro_db              # existing internal network (MongoDB); not modified
    external: true
  egress:
    name: bitbotpro_beta_egress     # beta-only outbound network (AI, Discord, Telegram, Zendesk, Resend)
    driver: bridge

secrets:
  beta_mongo_url:
    file: ${BITBOTPRO_BETA_SECRETS_DIR:?set BITBOTPRO_BETA_SECRETS_DIR}/beta_mongo_url
  beta_jwt_secret:
    file: ${BITBOTPRO_BETA_SECRETS_DIR:?}/beta_jwt_secret
  beta_encryption_keys:
    file: ${BITBOTPRO_BETA_SECRETS_DIR:?}/beta_encryption_keys
  beta_resend_api_key:
    file: ${BITBOTPRO_BETA_SECRETS_DIR:?}/beta_resend_api_key

x-hardening: &hardening
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-env: &env
  APP_ENV: production
  DB_NAME: bitbotpro_v12
  PUBLIC_API_URL: https://beta-api.bitbotpro.io
  PUBLIC_APP_URL: https://beta.bitbotpro.io
  CORS_ORIGINS: https://beta.bitbotpro.io
  ALLOWED_HOSTS: beta-api.bitbotpro.io,127.0.0.1,localhost
  TRUSTED_PROXIES: 10.50.0.1                 # Caddy over WireGuard (finding P-1: NOT TRUSTED_PROXY_IPS)
  FROM_EMAIL: ${BETA_FROM_EMAIL:?set BETA_FROM_EMAIL}
  WEBCHAT_DAILY_LIMIT_PER_INSTANCE: "500"
  MONGO_URL_FILE: /run/secrets/beta_mongo_url
  JWT_SECRET_FILE: /run/secrets/beta_jwt_secret
  ENCRYPTION_KEYS_FILE: /run/secrets/beta_encryption_keys
  ENCRYPTION_ACTIVE_KEY_ID: k1
  RESEND_API_KEY_FILE: /run/secrets/beta_resend_api_key

services:
  api:
    <<: *hardening
    image: bitbotpro-api:${BETA_IMAGE_TAG:?set BETA_IMAGE_TAG}
    container_name: bitbotpro-beta-api
    networks: [db, egress]
    ports:
      - "10.50.0.20:8001:8000"
    environment:
      <<: *env
      APP_MODE: api
    secrets: [beta_mongo_url, beta_jwt_secret, beta_encryption_keys, beta_resend_api_key]
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256

  worker:
    <<: *hardening
    image: bitbotpro-api:${BETA_IMAGE_TAG:?}
    container_name: bitbotpro-beta-worker
    command: ["python", "worker.py"]
    networks: [db, egress]
    environment:
      <<: *env
      APP_MODE: worker
      WORKER_ID: bitbotpro-beta-worker-1
    secrets: [beta_mongo_url, beta_jwt_secret, beta_encryption_keys, beta_resend_api_key]
    stop_grace_period: 30s
    mem_limit: 768m              # includes the sandboxed PDF extraction child process
    cpus: 1.0
    pids_limit: 256

  web:                           # static admin app for beta.bitbotpro.io (no secrets, no database)
    <<: *hardening
    image: caddy:2.8.4-alpine
    container_name: bitbotpro-beta-web
    # the official caddy binary carries the cap_net_bind_service file capability: with cap_drop ALL the
    # kernel refuses to exec it, so only that one capability is kept (it listens on 8080 regardless)
    cap_add: [NET_BIND_SERVICE]
    networks: [egress]
    ports:
      - "10.50.0.20:8002:8080"
    volumes:
      - ${BETA_FRONTEND_BUILD:?set BETA_FRONTEND_BUILD}:/srv:ro
      - ./web.Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=8m
      - /data:size=8m
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
