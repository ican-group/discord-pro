# PROPOSED (Spec 012 Phase 6B) — NOT APPLIED. Phase 7 cutover file, needs explicit approval.
#
# The Spec 012 API and its worker (D-Q4) from ONE release-candidate image. Replaces
# deploy/docker-compose.api.yml at cutover; keeps its network, secret-file and hardening
# conventions (no ports, read-only root, cap_drop ALL, non-root, json-file log rotation).
# The public edge stays the existing override deploy/docker-compose.edge-caddy.yml
# (TRUSTED_PROXIES=10.50.0.1, WireGuard) — Caddy, DNS and WireGuard are unchanged.
#
#   docker compose -f deploy/proposed/docker-compose.spec012.yml -f deploy/docker-compose.edge-caddy.yml \
#       --env-file deploy/.env up -d api worker
#
# Required in deploy/.env: BITBOTPRO_SECRETS_DIR, BITBOTPRO_SPEC012_TAG (release-candidate tag),
# BITBOTPRO_SPEC012_DB (the Spec 012 database name; decision 6B-E).

name: bitbotpro-api

networks:
  db:
    name: bitbotpro_db
    external: true
  egress:
    name: bitbotpro_egress
    driver: bridge

secrets:
  backend_mongo_url:
    file: ${BITBOTPRO_SECRETS_DIR:?set BITBOTPRO_SECRETS_DIR in deploy/.env}/backend_mongo_url
  jwt_secret:
    file: ${BITBOTPRO_SECRETS_DIR:?}/jwt_secret
  encryption_keys:            # key ring: one "<id>=<key>" per line (operations.md §1)
    file: ${BITBOTPRO_SECRETS_DIR:?}/encryption_keys
  resend_api_key:
    file: ${BITBOTPRO_SECRETS_DIR:?}/resend_api_key

x-hardening: &hardening
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true
  pids_limit: 256
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-env: &env
  APP_ENV: production
  DB_NAME: ${BITBOTPRO_SPEC012_DB:?set BITBOTPRO_SPEC012_DB (decision 6B-E)}
  PUBLIC_APP_URL: https://bitbotpro.io
  PUBLIC_API_URL: https://api.bitbotpro.io
  CORS_ORIGINS: https://bitbotpro.io
  FROM_EMAIL: noreply@bitbotpro.io
  MONGO_URL_FILE: /run/secrets/backend_mongo_url
  JWT_SECRET_FILE: /run/secrets/jwt_secret
  ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
  ENCRYPTION_ACTIVE_KEY_ID: k1
  RESEND_API_KEY_FILE: /run/secrets/resend_api_key

services:
  api:
    <<: *hardening
    image: bitbotpro-api:${BITBOTPRO_SPEC012_TAG:?set BITBOTPRO_SPEC012_TAG}
    container_name: bitbotpro-api
    networks: [db, egress]
    environment:
      <<: *env
      APP_MODE: api
    secrets: [backend_mongo_url, jwt_secret, encryption_keys, resend_api_key]
    stop_grace_period: 30s
    mem_limit: 2g

  worker:
    <<: *hardening
    image: bitbotpro-api:${BITBOTPRO_SPEC012_TAG:?}
    container_name: bitbotpro-worker
    command: ["python", "worker.py"]
    networks: [db, egress]          # MongoDB + outbound (Discord gateway, Telegram, Zendesk, AI); no inbound
    environment:
      <<: *env
      APP_MODE: worker
      WORKER_ID: bitbotpro-worker-1
    secrets: [backend_mongo_url, jwt_secret, encryption_keys, resend_api_key]
    stop_grace_period: 30s           # the gateway closes with 1000; leases expire
    mem_limit: 1g
