# deploy/docker-compose.admin.yml — one-off administrative commands (spec 004).
#
# Override file, used ONLY for explicit admin actions, always after the base file:
#
#   sudo docker compose -f deploy/docker-compose.api.yml -f deploy/docker-compose.admin.yml \
#     --env-file deploy/.env --profile admin run --rm admin-cli \
#     bootstrap-superadmin --email admin@bitbotpro.io --password-file /run/secrets/admin_password
#   (dry run; add --confirm only after separate approval)
#
# This is the ONLY place admin_password is declared. Normal API operations
# (build/up/down/restart/health) use docker-compose.api.yml without this file, so
# deleting ~/.bitbotpro/secrets/admin_password after the bootstrap cannot affect them.
# Never use `up` with this file; `run --rm` only.

secrets:
  admin_password:
    file: ${BITBOTPRO_SECRETS_DIR:?set BITBOTPRO_SECRETS_DIR in deploy/.env}/admin_password

services:
  admin-cli:
    image: bitbotpro-api:${BITBOTPRO_API_TAG:?set BITBOTPRO_API_TAG in deploy/.env}
    pull_policy: never
    profiles: [admin]             # never started by `up`
    networks: [db]                # database only; no internet
    # Same hardening as the api service (keep in sync with docker-compose.api.yml)
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint: ["/app/docker-entrypoint.sh", "python", "manage.py"]
    command: ["--help"]
    environment:
      APP_MODE: api
      APP_ENV: production
      DB_NAME: bitbotpro
      MONGO_URL_FILE: /run/secrets/backend_mongo_url
    secrets: [backend_mongo_url, admin_password]
